<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConvoyGate Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0f17;
      color: #e2e8f0;
      margin: 0;
      padding: 28px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      border-bottom: 1px solid #1f2438;
      padding-bottom: 15px;
    }
    h1 { margin: 0; color: #38bdf8; font-size: 1.6rem; }
    .badge {
      background: #082f49;
      color: #38bdf8;
      border: 1px solid #0369a1;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-family: monospace;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      color: #94a3b8;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #141724;
      border: 1px solid #242b42;
      border-radius: 8px;
      padding: 11px 14px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; }
    .btn-sync {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-sync:hover { opacity: 0.9; }
    .btn-sync:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .progress-bar-bg {
      display: none;
      width: 100%;
      height: 8px;
      background: #141724;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 18px;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.15s ease;
    }

    .log-box {
      margin-top: 18px;
      background: #10131e;
      border: 1px solid #1e2438;
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 0.85rem;
      min-height: 110px;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #38bdf8;
    }
    .log-box.error { color: #f87171; border-color: #7f1d1d; }
  </style>
</head>
<body>

  <div class="header">
    <h1>ConvoyGate Launcher</h1>
    <div id="hwidBadge" class="badge">Detecting HWID...</div>
  </div>

  <div class="form-group">
    <label>Server URL</label>
    <input type="text" id="serverUrl" value="http://192.168.86.111:3000">
  </div>

  <div class="form-group">
    <label>Discord Account ID</label>
    <input type="text" id="discordId" placeholder="e.g. 123456789" value="123456">
  </div>

  <div class="form-group">
    <label>Target Mod Package</label>
    <input type="text" id="modId" value="volvo-rigid">
  </div>

  <button class="btn-sync" id="btnSync">Sync Mod & Verify 30-Day Lease</button>

  <div id="progressBarBg" class="progress-bar-bg">
    <div id="progressBarFill" class="progress-bar-fill"></div>
  </div>

  <div id="logBox" class="log-box">ConvoyGate Client Ready.</div>

  <script>
    const { ipcRenderer } = require("electron");

    let currentHwid = "";
    const hwidBadge = document.getElementById("hwidBadge");
    const logBox = document.getElementById("logBox");
    const btnSync = document.getElementById("btnSync");
    const progressBarBg = document.getElementById("progressBarBg");
    const progressBarFill = document.getElementById("progressBarFill");

    async function initHwid() {
      currentHwid = await ipcRenderer.invoke("get-hwid");
      hwidBadge.innerText = `HWID: ${currentHwid.substring(0, 14)}...`;
      hwidBadge.title = currentHwid;
    }
    initHwid();

    ipcRenderer.on("sync-progress", (event, data) => {
      logBox.innerText += `\n> ${data.message}`;
      logBox.scrollTop = logBox.scrollHeight;
      if (data.percent !== undefined) {
        progressBarBg.style.display = "block";
        progressBarFill.style.width = data.percent + "%";
      }
    });

    document.getElementById("btnSync").addEventListener("click", async () => {
      const serverUrl = document.getElementById("serverUrl").value.trim();
      const discordId = document.getElementById("discordId").value.trim();
      const modId = document.getElementById("modId").value.trim();

      if (!serverUrl || !modId) {
        alert("Server URL and Mod Package Slug are required.");
        return;
      }

      btnSync.disabled = true;
      logBox.className = "log-box";
      progressBarBg.style.display = "block";
      progressBarFill.style.width = "5%";
      logBox.innerText = `[${new Date().toLocaleTimeString()}] Starting synchronization...`;

      const result = await ipcRenderer.invoke("sync-mod-and-lease", {
        serverUrl,
        discordId,
        modId,
        hwid: currentHwid,
      });

      btnSync.disabled = false;

      if (result.success) {
        progressBarFill.style.width = "100%";
        logBox.innerText += `\n\nSUCCESS:\n${result.message}`;
      } else {
        logBox.className = "log-box error";
        logBox.innerText += `\n\nERROR:\n${result.error}`;
      }
      logBox.scrollTop = logBox.scrollHeight;
    });
  </script>
</body>
</html>
