<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConvoyGate Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0f17;
      color: #e2e8f0;
      margin: 0;
      padding: 30px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #1f2438;
      padding-bottom: 15px;
    }
    h1 { margin: 0; color: #38bdf8; font-size: 1.6rem; }
    .badge {
      background: #082f49;
      color: #38bdf8;
      border: 1px solid #0369a1;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-family: monospace;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      color: #94a3b8;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: #141724;
      border: 1px solid #242b42;
      border-radius: 8px;
      padding: 12px 14px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; }
    .btn-sync {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-sync:hover { background: #0369a1; }
    .log-box {
      margin-top: 25px;
      background: #10131e;
      border: 1px solid #1e2438;
      border-radius: 8px;
      padding: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      min-height: 110px;
      white-space: pre-wrap;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ConvoyGate Launcher</h1>
    <div id="hwidBadge" class="badge">Detecting...</div>
  </div>

  <div class="form-group">
    <label>Server URL</label>
    <input type="text" id="serverUrl" value="http://192.168.86.111:3000">
  </div>

  <div class="form-group">
    <label>Discord Account ID</label>
    <input type="text" id="discordId" placeholder="e.g. 84920491823901923" value="123456789">
  </div>

  <div class="form-group">
    <label>Target Mod Package</label>
    <input type="text" id="modId" value="volvo-rigid">
  </div>

  <button class="btn-sync" id="btnSync">Sync Mod & Verify 30-Day Lease</button>

  <div id="logBox" class="log-box">ConvoyGate Client Ready.</div>

  <script>
    const { ipcRenderer } = require("electron");

    let currentHwid = "";
    const hwidBadge = document.getElementById("hwidBadge");
    const logBox = document.getElementById("logBox");

    async function initHwid() {
      currentHwid = await ipcRenderer.invoke("get-hwid");
      hwidBadge.innerText = `HWID: ${currentHwid.substring(0, 12)}...`;
      hwidBadge.title = currentHwid;
    }
    initHwid();

    ipcRenderer.on("sync-progress", (event, data) => {
      logBox.innerText += `\n> ${data.message}`;
    });

    document.getElementById("btnSync").addEventListener("click", async () => {
      const serverUrl = document.getElementById("serverUrl").value.trim();
      const discordId = document.getElementById("discordId").value.trim();
      const modId = document.getElementById("modId").value.trim();

      if (!serverUrl || !modId) {
        alert("Server URL and Mod Package Slug are required.");
        return;
      }

      logBox.innerText = `[${new Date().toLocaleTimeString()}] Starting synchronization...`;

      const result = await ipcRenderer.invoke("sync-mod-and-lease", {
        serverUrl,
        discordId,
        modId,
        hwid: currentHwid,
      });

      if (result.success) {
        logBox.innerText += `\n\nSUCCESS:\n${result.message}\n\nYou can now launch American Truck Simulator!`;
      } else {
        logBox.innerText += `\n\nERROR:\n${result.error}`;
      }
    });
  </script>
</body>
</html>
