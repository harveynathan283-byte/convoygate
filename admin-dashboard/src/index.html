<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConvoyGate Admin Control Center</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f17;
      color: #e2e8f0;
      margin: 0;
      padding: 30px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #1f2438;
      padding-bottom: 15px;
    }
    h1 {
      margin: 0;
      color: #9d4edd;
      font-size: 1.8rem;
    }
    .badge {
      background: #240046;
      color: #c77dff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #5a189a;
    }
    .drop-zone {
      border: 2px dashed #5a189a;
      background: #141724;
      border-radius: 12px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 30px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #9d4edd;
      background: #1b1f33;
    }
    .drop-zone h3 {
      margin: 0 0 8px 0;
      color: #f1f5f9;
      font-size: 1.25rem;
    }
    .drop-zone p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .status-box {
      display: none;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .status-box.active {
      display: block;
      background: #192b23;
      color: #4ade80;
      border: 1px solid #22543d;
    }
    .status-box.error {
      display: block;
      background: #3b181f;
      color: #f87171;
      border: 1px solid #771d2d;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #141724;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1f2438;
    }
    th, td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid #1f2438;
    }
    th {
      background: #1b1f33;
      color: #94a3b8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-danger { background: #e63946; color: #fff; }
    .btn-refresh { background: #3c096c; color: #e0aaff; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>ConvoyGate Admin Publisher</h1>
      <small style="color: #64748b;">Lock assets & deploy live to subscribers</small>
    </div>
    <div class="badge">Master Key Active</div>
  </div>

  <div class="drop-zone" id="dropZone">
    <h3>Drop Mod Folder Here to Pack & Publish</h3>
    <p>Automatically applies SCS header obfuscation, locks assets, and uploads to catalog</p>
  </div>

  <div id="statusBox" class="status-box"></div>

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2 style="font-size: 1.2rem; margin: 0 0 12px 0;">Live Mod Catalog</h2>
    <button class="btn btn-refresh" onclick="loadCatalog()">Refresh Catalog</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Mod Slug</th>
        <th>Display Name</th>
        <th>Version</th>
        <th>Access Tier</th>
        <th>Package Size</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="catalogTable"></tbody>
  </table>

  <script>
    const { ipcRenderer } = require("electron");
    const path = require("path");
    const os = require("os");

    const dropZone = document.getElementById("dropZone");
    const statusBox = document.getElementById("statusBox");
    const catalogTable = document.getElementById("catalogTable");

    function setStatus(text, isError = false) {
      statusBox.innerText = text;
      statusBox.className = "status-box active" + (isError ? " error" : "");
    }

    async function loadCatalog() {
      const res = await ipcRenderer.invoke("fetch-catalog");
      catalogTable.innerHTML = "";
      if (res.success && res.mods.length > 0) {
        res.mods.forEach(mod => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><code>${mod.id}</code></td>
            <td><strong>${mod.name}</strong></td>
            <td>${mod.version}</td>
            <td><span style="background: #2b1b40; color: #d8b4fe; padding: 3px 8px; border-radius: 4px;">${mod.tier}</span></td>
            <td>${(mod.file_size / 1024 / 1024).toFixed(2)} MB</td>
            <td><button class="btn btn-danger" onclick="deleteMod('${mod.id}')">Delete</button></td>
          `;
          catalogTable.appendChild(row);
        });
      } else {
        catalogTable.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#64748b;">No mods uploaded yet. Drag a folder above to publish.</td></tr>`;
      }
    }
    loadCatalog();

    window.deleteMod = async (modId) => {
      if (confirm(`Are you sure you want to delete '${modId}' from the cloud?`)) {
        setStatus(`Deleting ${modId}...`);
        await ipcRenderer.invoke("delete-mod", modId);
        setStatus(`Mod '${modId}' removed from catalog.`);
        loadCatalog();
      }
    };

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", async (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");

      if (!e.dataTransfer.files.length) return;
      const sourceFolder = e.dataTransfer.files[0].path;
      const folderName = path.basename(sourceFolder);

      const modName = prompt("Enter Mod Display Name:", folderName);
      if (!modName) return;

      const requiredTier = prompt("Required Subscription Tier (e.g. VIP, Basic, All):", "All");
      if (!requiredTier) return;

      const tempScs = path.join(os.tmpdir(), `${folderName}.scs`);

      setStatus(`Step 1/2: Packing and locking '${folderName}' archive locally...`);
      const packRes = await ipcRenderer.invoke("pack-mod", { sourceFolder, outputPath: tempScs });

      if (!packRes.success) {
        setStatus(`Packing Failed: ${packRes.error}`, true);
        return;
      }

      setStatus(`Step 2/2: Uploading locked package (${(packRes.size / 1024 / 1024).toFixed(2)} MB) to cloud...`);
      const uploadRes = await ipcRenderer.invoke("upload-mod", {
        filePath: tempScs,
        modId: folderName,
        name: modName,
        version: "1.0.0",
        tier: requiredTier,
      });

      if (uploadRes.success) {
        setStatus(`Success! '${modName}' is now locked and live on the catalog.`);
        loadCatalog();
      } else {
        setStatus(`Upload Failed: ${uploadRes.error}`, true);
      }
    });
  </script>
</body>
</html>
