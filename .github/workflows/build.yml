name: Build ConvoyGate Installers

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. BUILD ADMIN INSTALLER
      - name: Build Admin Installer
        run: |
          cd admin-dashboard
          npm install
          npm run build:win

      # 2. COMPILE C++ PLUGIN (.cpp -> convoygate.dll)
      - name: Compile ConvoyGate Plugin DLL
        shell: pwsh
        run: |
          cmake -B plugin/build -S plugin
          cmake --build plugin/build --config Release
          Copy-Item plugin/build/Release/*.dll -Destination client/ -Force

      # 3. BUILD CLIENT INSTALLER WITH AUTO-INCREMENTED VERSION
      - name: Build Client Installer
        shell: pwsh
        run: |
          cd client
          $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          npm version $ver --no-git-tag-version
          npm install
          npm run build:win

      # 4. COMPRESS ZIP ARTIFACTS FOR MANUAL DOWNLOADS
      - name: Package ZIPs
        shell: pwsh
        run: |
          mkdir dist_zip
          Compress-Archive -Path "admin-dashboard/dist/*Setup*.exe" -DestinationPath "dist_zip/ConvoyGate-Admin-Setup.zip"
          Compress-Archive -Path "client/dist/ConvoyGate-Setup-*.exe" -DestinationPath "dist_zip/ConvoyGate-Client-Setup.zip"

      # 5. PUBLISH RELEASE + UPDATER METADATA (latest.yml & blockmap)
      - name: Publish Release Installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v1.0.$env:GITHUB_RUN_NUMBER"
          $exe = (Get-ChildItem "client/dist/ConvoyGate-Setup-*.exe" | Select-Object -First 1).FullName
          $blockmap = (Get-ChildItem "client/dist/ConvoyGate-Setup-*.exe.blockmap" | Select-Object -First 1).FullName
          $yml = (Get-ChildItem "client/dist/latest.yml" | Select-Object -First 1).FullName

          gh release create $tag `
            "$exe" `
            "$blockmap" `
            "$yml" `
            "dist_zip/ConvoyGate-Client-Setup.zip" `
            "dist_zip/ConvoyGate-Admin-Setup.zip" `
            --title "ConvoyGate $tag" `
            --notes "Automated build $tag"

          # Clean up older releases (keep newest 3)
          $oldReleases = gh release list --limit 20 --json tagName -q ".[3:][].tagName"
          foreach ($old in$oldReleases) {
            if ($old) {
              gh release delete $old --yes --cleanup-tag 2>$null
            }
          }