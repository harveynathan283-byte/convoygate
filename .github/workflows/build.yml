name: Build ConvoyGate Installers

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. BUILD ADMIN INSTALLER
      - name: Build Admin Installer
        run: |
          cd admin-dashboard
          npm install
          npm run build:win

      # 2. COMPILE C++ PLUGIN (convoygate_plugin.dll)
      - name: Compile ConvoyGate Plugin DLL
        shell: pwsh
        run: |
          cmake -B plugin/build -S plugin
          cmake --build plugin/build --config Release
          $dll = Get-ChildItem -Path plugin -Recurse -Filter "convoygate_plugin.dll" | Select-Object -First 1
          if ($dll) {
            Write-Host "Successfully built plugin at: $($dll.FullName)"
            Copy-Item $dll.FullName -Destination "client/convoygate_plugin.dll" -Force
            Copy-Item $dll.FullName -Destination "plugin/convoygate_plugin.dll" -Force
          } else {
            Write-Error "CRITICAL: convoygate_plugin.dll was not generated by CMake!"
            exit 1
          }

      # 3. BUILD CLIENT INSTALLER (Now includes the compiled DLL)
      - name: Build Client Installer
        run: |
          cd client
          npm install
          npm run build:win

      # 4. COMPRESS ARTIFACTS INTO SEPARATE ZIP PACKAGES
      - name: Package Admin ZIP
        shell: pwsh
        run: |
          mkdir dist_zip
          Compress-Archive -Path "admin-dashboard/dist/*Setup*.exe" -DestinationPath "dist_zip/ConvoyGate-Admin-Setup.zip"

      - name: Package Client ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "client/dist/*Setup*.exe" -DestinationPath "dist_zip/ConvoyGate-Client-Setup.zip"

      # 5. UPLOAD ADMIN ARTIFACT
      - name: Upload Admin Setup Package
        uses: actions/upload-artifact@v4
        with:
          name: ConvoyGate-Admin-Installer
          path: dist_zip/ConvoyGate-Admin-Setup.zip

      # 6. UPLOAD CLIENT ARTIFACT
      - name: Upload Client Setup Package
        uses: actions/upload-artifact@v4
        with:
          name: ConvoyGate-Client-Installer
          path: dist_zip/ConvoyGate-Client-Setup.zip