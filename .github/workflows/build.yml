name: Build Windows Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_GET_MAX_RETRIES: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Compile C++ Plugin directly into client and root
      - name: Compile ATS Plugin DLL
        run: |
          cl /LD /O2 /EHsc plugin/convoygate_plugin.cpp /Fe:client/convoygate.dll /link advapi32.lib crypt32.lib user32.lib
          copy client\convoygate.dll convoygate.dll
        shell: cmd

      # 2. Build Admin Dashboard GUI (.exe)
      - name: Build Admin Dashboard GUI
        run: |
          cd admin-dashboard
          npm install
          npm run dist
        shell: bash

      # 3. Build Client Launcher GUI (.exe)
      - name: Build Client Launcher GUI
        run: |
          cd client
          npm install
          npm run dist
        shell: bash

      # 4. Upload Complete Executable Suite
      - name: Upload Complete Suite
        uses: actions/upload-artifact@v4
        with:
          name: ConvoyGate-GUI-Suite
          path: |
            admin-dashboard/dist/*.exe
            client/dist/*.exe
            convoygate.dll