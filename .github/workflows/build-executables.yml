name: Build Windows Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Compile C++ Plugin to convoygate.dll using MSVC
      - name: Compile ATS Plugin DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /LD /O2 plugin/convoygate_plugin.cpp /Fe:convoygate.dll

      # 2. Build Admin GUI Dashboard (.exe)
      - name: Build Admin Dashboard GUI
        run: |
          cd admin-dashboard
          npm install
          npm run dist

      # 3. Build Client Launcher GUI (.exe)
      - name: Build Client Launcher GUI
        run: |
          cd client
          npm install
          npm run dist

      # 4. Copy convoygate.dll into dist folder for packaging
      - name: Stage Artifacts
        run: |
          cp convoygate.dll client/dist/

      # 5. Upload Complete Windows Suite (Admin, Launcher & DLL)
      - name: Upload GUI Suite & DLL
        uses: actions/upload-artifact@v4
        with:
          name: ConvoyGate-GUI-Suite
          path: |
            admin-dashboard/dist/*.exe
            client/dist/*.exe
            convoygate.dll