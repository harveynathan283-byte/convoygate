name: Build Windows Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Automatically sets up the MSVC compiler on any Windows runner
      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Compile C++ Plugin directly into 64-bit convoygate.dll
      - name: Compile ATS Plugin DLL
        run: |
          cl /LD /O2 /EHsc plugin/convoygate_plugin.cpp /Fe:convoygate.dll /link advapi32.lib bcrypt.lib crypt32.lib user32.lib

      # 2. Build Admin Dashboard GUI (.exe)
      - name: Build Admin Dashboard GUI
        run: |
          cd admin-dashboard
          npm install
          npm run dist

      # 3. Build Client Launcher GUI (.exe)
      - name: Build Client Launcher GUI
        run: |
          cd client
          npm install
          npm run dist

      # 4. Copy DLL into dist for distribution
      - name: Stage Artifacts
        run: |
          cp convoygate.dll client/dist/

      # 5. Upload Complete Windows Suite (Admin EXE, Launcher EXE & convoygate.dll)
      - name: Upload GUI Suite & DLL
        uses: actions/upload-artifact@v4
        with:
          name: ConvoyGate-GUI-Suite
          path: |
            admin-dashboard/dist/*.exe
            client/dist/*.exe
            convoygate.dll