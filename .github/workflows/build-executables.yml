name: Build Windows Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Build the Admin GUI Dashboard (.exe)
      - name: Build Admin Dashboard GUI
        run: |
          cd admin-dashboard
          npm install
          npm run dist

      # 2. Build the Client Launcher (.exe)
      - name: Build Client Launcher GUI
        run: |
          cd client
          npm install
          npm run dist

      # 3. Package both graphical apps together
      - name: Upload Both GUI Apps
        uses: actions/upload-artifact@v4
        with:
          name: ConvoyGate-GUI-Suite
          path: |
            admin-dashboard/dist/*.exe
            client/dist/*.exe