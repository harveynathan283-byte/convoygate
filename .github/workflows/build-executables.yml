name: Build Windows Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Compile C++ Plugin directly into client and root
      - name: Compile ATS Plugin DLL
        run: |
          cl /LD /O2 /EHsc plugin/convoygate_plugin.cpp /Fe:client/convoygate.dll /link advapi32.lib crypt32.lib user32.lib
          copy client\convoygate.dll convoygate.dll
        shell: cmd

      # 2. Build Admin Dashboard GUI (.exe) with automatic retry on 504 timeout
      - name: Build Admin Dashboard GUI
        shell: bash
        run: |
          cd admin-dashboard
          npm install
          for i in {1..5}; do
            echo "Packaging Admin Dashboard (Attempt $i)..."
            npm run dist && break || {
              if [ $i -eq 5 ]; then exit 1; fi
              echo "GitHub download timed out (504). Retrying in 10s..."
              sleep 10
            }
          done

      # 3. Build Client Launcher GUI (.exe) with automatic retry on 504 timeout
      - name: Build Client Launcher GUI
        shell: bash
        run: |
          cd client
          npm install
          for i in {1..5}; do
            echo "Packaging Client Launcher (Attempt $i)..."
            npm run dist && break || {
              if [ $i -eq 5 ]; then exit 1; fi
              echo "GitHub download timed out (504). Retrying in 10s..."
              sleep 10
            }
          done

      # 4. Upload Complete Executable Suite
      - name: Upload Complete Suite
        uses: actions/upload-artifact@v4
        with:
          name: ConvoyGate-GUI-Suite
          path: |
            admin-dashboard/dist/*.exe
            client/dist/*.exe
            convoygate.dll